import { useState } from "react";
import { ShoppingCart, Trash2 } from "lucide-react";
import { Button } from "@/components/ui/button";
import { Card, CardContent } from "@/components/ui/card";

// Sample products (Coconut Chips flavors)
const products = [
  { id: 1, name: "Classic Roasted Coconut Chips", price: 120, image: "https://images.unsplash.com/photo-1604908176997-42e1c8eebf4d" },
  { id: 2, name: "Masala Coconut Chips", price: 150, image: "https://images.unsplash.com/photo-1625949276166-9bdf4cf0a1d1" },
  { id: 3, name: "Sweet Caramel Coconut Chips", price: 180, image: "https://images.unsplash.com/photo-1625949237122-41cfef95c0d7" },
];

export default function CoconutChipsStore() {
  const [cart, setCart] = useState([]);

  const addToCart = (product) => {
    setCart([...cart, product]);
  };

  const removeFromCart = (id) => {
    setCart(cart.filter((item, index) => index !== id));
  };

  const total = cart.reduce((sum, item) => sum + item.price, 0);

  return (
    <div className="min-h-screen bg-amber-50 p-6">
      {/* Header */}
      <header className="flex justify-between items-center mb-6">
        <h1 className="text-3xl font-bold text-amber-900">🥥 Healthy Crunch</h1>
        <div className="flex items-center space-x-2">
          <ShoppingCart className="w-6 h-6 text-amber-800" />
          <span className="font-semibold">{cart.length}</span>
        </div>
      </header>

      {/* Product List */}
      <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
        {products.map((product) => (
          <Card key={product.id} className="rounded-2xl shadow-md hover:shadow-xl transition">
            <img
              src={product.image}
              alt={product.name}
              className="rounded-t-2xl w-full h-48 object-cover"
            />
            <CardContent className="p-4">
              <h2 className="text-xl font-semibold mb-2">{product.name}</h2>
              <p className="text-amber-800 font-bold mb-2">₹{product.price}</p>
              <Button onClick={() => addToCart(product)} className="bg-amber-700 text-white w-full">
                Add to Cart
              </Button>
            </CardContent>
          </Card>
        ))}
      </div>

      {/* Cart Section */}
      <div className="mt-10 bg-white rounded-2xl shadow-lg p-6 max-w-lg mx-auto">
        <h2 className="text-2xl font-bold text-amber-900 mb-4">🛒 Your Cart</h2>
        {cart.length === 0 ? (
          <p className="text-gray-600">Your cart is empty</p>
        ) : (
          <ul className="space-y-3">
            {cart.map((item, index) => (
              <li key={index} className="flex justify-between items-center">
                <span>{item.name}</span>
                <div className="flex items-center space-x-2">
                  <span className="font-semibold">₹{item.price}</span>
                  <Trash2
                    className="w-5 h-5 text-red-500 cursor-pointer"
                    onClick={() => removeFromCart(index)}
                  />
                </div>
              </li>
            ))}
          </ul>
        )}

        {/* Total */}
        <div className="flex justify-between items-center mt-4 border-t pt-4">
          <span className="font-bold text-lg">Total:</span>
          <span className="font-bold text-amber-900 text-lg">₹{total}</span>
        </div>

        <Button className="bg-green-600 text-white mt-4 w-full">Proceed to Checkout</Button>
      </div>
    </div>
  );
}
